[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nsim"
version = "0.1.0"
description = "Traceable ASIC simulation regression orchestration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7", "packaging>=23", "tomli>=2; python_version < '3.11'"]

[project.scripts]
nsim = "nsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
